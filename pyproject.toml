[tool.poetry]
name = "poc-langchain"
version = "0.1.0"
description = "Assistant Email + Calendrier Automatique avec LangChain et Streamlit"
authors = ["jabo"]
readme = "README.md"
packages = [
    { include = "my_assistant" }
]

[tool.poetry.dependencies]
python = "^3.11"
streamlit = "^1.53.1"
pydantic = "^2.12.5"
langchain = "^1.2.7"
langchain-ollama = "^1.0.1"
python-dotenv = "^1.2.1"

[tool.poetry.dev-dependencies]
black = "^26.1.0"
flake8 = "^7.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
langgraph-cli = {extras = ["inmem"], version = "^0.4.12"}
langgraph = "^1.0.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 100
target-version = ['py311']


[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ruff.isort]
known-first-party = ["poc-langchain"]